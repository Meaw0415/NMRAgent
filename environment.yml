name: nmragent
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  # Minimal runtime for scripts/run_multi_agent_nmr_v2.py.
  # UniMol/UniCore are vendored in ./third_party and are loaded from the repo.
  - python=3.11
  - pip
  - libstdcxx-ng>=13
  - numpy>=1.26,<2.3
  - scipy>=1.13
  - pandas>=2.2
  - scikit-learn>=1.4
  - joblib>=1.3
  - pyyaml>=6.0
  - rdkit>=2024.09
  - faiss-cpu>=1.8
  - lmdb>=1.4
  - msgpack-python>=1.0
  - tqdm>=4.66
  - requests>=2.31
  - flask>=3.0
  - pytorch=2.5.*
  - pytorch-cuda=12.1
  - pip:
      - openai>=2.0,<3
      - langgraph>=1.0,<2
      - langchain-core>=1.0,<2
      - transformers>=4.45,<5
      - accelerate>=1.0,<2
      - tokenizers>=0.20,<1
      - safetensors>=0.4,<1
      - addict>=2.4,<3
